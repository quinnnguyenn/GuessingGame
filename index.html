<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
</head>
<body>

    <script>
        const randomNumber = Math.floor(Math.random() * 10) +1;
  
        let guessCount = 0;
        let guess;
        let message = ("Guess a Number between 1 and 10.");

        while (true) {
            guess = parseInt(prompt(message), 10);
            guessCount++;

            if (guess < randomNumber) {
                guess = message("Your guess was too low, guess again.");
            } else if (guess > randomNumber) {
                guess = message("Your guess was too high, guess again.");
            } else {
                prompt(`You guessed it in ${guessCount} guesses!`);
                break;
            }
        }
        
    </script>
    
</body>
</html>
